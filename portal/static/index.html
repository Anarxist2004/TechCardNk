<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сервис НК сварных соединений</title>
  <link rel="stylesheet" href="/portal-static/module-nav.css">
  <link rel="stylesheet" href="/portal-static/style.css">
  <script src="/portal-static/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <section class="auth-panel" id="authPanel">
      <div class="brand">
        <span class="mark">НК</span>
        <div>
          <h1>Сервис контроля сварных соединений</h1>
          <p>Авторизуйтесь, чтобы открыть технологические карты или экспертный анализ.</p>
        </div>
      </div>

      <form class="auth-form" id="authForm">
        <div class="mode-switch" role="tablist" aria-label="Режим авторизации">
          <button type="button" class="mode active" data-mode="login">Вход</button>
          <button type="button" class="mode" data-mode="register">Регистрация</button>
        </div>

        <label>
          Логин
          <input id="username" name="username" autocomplete="username" required minlength="3">
        </label>

        <label class="register-only hidden">
          ФИО
          <input id="fullName" name="full_name" autocomplete="name">
        </label>

        <label class="register-only hidden">
          Должность
          <input id="position" name="position" autocomplete="organization-title">
        </label>

        <label class="register-only hidden">
          Компания
          <input id="company" name="company" autocomplete="organization">
        </label>

        <label>
          Пароль
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
        </label>

        <p class="message" id="authMessage"></p>
        <button class="primary" type="submit" id="submitButton">Войти</button>
      </form>
    </section>

    <section class="dashboard hidden" id="dashboard">
      <nav class="nk-module-nav dashboard-module-nav">
        <div class="nk-module-tabs">
          <a class="nk-module-tab" href="/expert-analysis/">Экспертный анализ</a>
          <a class="nk-module-tab" href="/tech-cards/">Техкарты</a>
        </div>

        <div class="nk-module-user-menu">
          <button class="nk-module-user" type="button" id="userMenuButton" aria-expanded="false">
            <span class="nk-module-avatar" id="dashboardAvatar">U</span>
            <span class="nk-module-username" id="dashboardUsername">Пользователь</span>
          </button>
          <div class="nk-module-menu hidden" id="userMenu">
            <button type="button" id="logoutButton">Выйти</button>
          </div>
        </div>
      </nav>

      <div class="dashboard-content">
        <span class="eyebrow">Единый сервис</span>
        <h1>Выберите модуль сверху</h1>
        <p id="welcomeText"></p>
      </div>
    </section>
  </main>
</body>
</html>
